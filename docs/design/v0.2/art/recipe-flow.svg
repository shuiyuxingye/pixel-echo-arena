<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><title>V0.2设计示意，非当前游戏截图</title><rect x="0" y="0" width="1200" height="400" rx="12" fill="#151922" stroke="none" stroke-width="1"/><text x="35" y="48" font-family="STHeiti, sans-serif" font-size="29" fill="#ECEFF5">三个指定材料，合成一个新的成长核心</text><rect x="35" y="90" width="240" height="130" rx="12" fill="#293340" stroke="none" stroke-width="1"/><text x="53" y="140" font-family="STHeiti, sans-serif" font-size="26" fill="#ECEFF5">红铜心</text><text x="53" y="185" font-family="STHeiti, sans-serif" font-size="18" fill="#B8C6DA">生命 / 移速代价</text><text x="281" y="166" font-family="STHeiti, sans-serif" font-size="25" fill="#FFCF75">+</text><rect x="305" y="90" width="240" height="130" rx="12" fill="#293340" stroke="none" stroke-width="1"/><text x="323" y="140" font-family="STHeiti, sans-serif" font-size="26" fill="#ECEFF5">反应护甲</text><text x="323" y="185" font-family="STHeiti, sans-serif" font-size="18" fill="#B8C6DA">护甲 / 攻速代价</text><text x="551" y="166" font-family="STHeiti, sans-serif" font-size="25" fill="#FFCF75">+</text><rect x="575" y="90" width="240" height="130" rx="12" fill="#293340" stroke="none" stroke-width="1"/><text x="593" y="140" font-family="STHeiti, sans-serif" font-size="26" fill="#ECEFF5">锻心碎片</text><text x="593" y="185" font-family="STHeiti, sans-serif" font-size="18" fill="#B8C6DA">受击反攻 / 移速代价</text><text x="850" y="164" font-family="STHeiti, sans-serif" font-size="42" fill="#FFCF75">→</text><rect x="930" y="88" width="235" height="232" rx="12" fill="#6A4C28" stroke="none" stroke-width="1"/><text x="947" y="136" font-family="STHeiti, sans-serif" font-size="29" fill="#FFDE9C">锻心引擎</text><text x="947" y="182" font-family="STHeiti, sans-serif" font-size="18" fill="#ECEFF5">生命 +80 / 护甲 +20</text><text x="947" y="220" font-family="STHeiti, sans-serif" font-size="22" fill="#ECEFF5">随击杀继续成长</text><text x="947" y="258" font-family="STHeiti, sans-serif" font-size="17" fill="#ECEFF5">移速 -6% / 成长有上限</text><text x="35" y="273" font-family="STHeiti, sans-serif" font-size="23" fill="#ECEFF5">消耗三种材料各1件 + 50金币；移除材料原有正负效果，再应用完整成品。</text><text x="35" y="323" font-family="STHeiti, sans-serif" font-size="22" fill="#B8C6DA">显示合成净变化，不叠算两份属性。多余材料保留，成品唯一，不可拆解。</text><text x="35" y="371" font-family="STHeiti, sans-serif" font-size="18" fill="#ABBACB">设计示意 · 对应 R01，完整配方与效果见内容目录</text></svg>