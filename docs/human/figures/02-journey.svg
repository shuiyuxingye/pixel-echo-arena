<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img"><title>从打开游戏到通关的流程</title>
<rect x="0" y="0" width="1000" height="260" rx="12" fill="#F2F6F6" stroke="none" stroke-width="1"/>
<rect x="24" y="55" width="220" height="110" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="24" y="55" width="6" height="110" rx="0" fill="#087F8C" stroke="none" stroke-width="1"/>
<text x="44" y="97" font-family="STHeiti, PingFang SC, sans-serif" font-size="25" fill="#172B36" text-anchor="start">打开 HTML</text>
<text x="44" y="133" font-family="STHeiti, PingFang SC, sans-serif" font-size="19" fill="#51636C" text-anchor="start">不需服务器</text>
<line x1="246" y1="110" x2="266" y2="110" stroke="#087F8C" stroke-width="3"/>
<polygon points="266,110 255.19463477176788,115.21958640933477 255.19463477176788,104.78041359066523" fill="#087F8C"/>
<rect x="270" y="55" width="220" height="110" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1"/>
